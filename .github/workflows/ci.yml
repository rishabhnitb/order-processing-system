name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Step 1: detect which modules changed ──────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      order-service: ${{ steps.filter.outputs.order-service }}
      inventory-service: ${{ steps.filter.outputs.inventory-service }}
    steps:
      - uses: actions/checkout@v4

      # dorny/paths-filter outputs true/false per filter.
      # pom.xml changes trigger a rebuild of everything that inherits from it.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-service:
              - 'order-service/**'
              - 'pom.xml'
            inventory-service:
              - 'inventory-service/**'
              - 'pom.xml'

  # ── Step 2a: build + test order-service (only if it changed) ──────────────
  build-order-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven           # caches ~/.m2 between runs for faster builds

      # -pl order-service  → only build this module
      # -am                → also build parent pom (needed for child)
      # verify             → compile + test + jacoco check
      - name: Build and test order-service
        run: mvn -B -pl order-service -am verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-coverage
          path: order-service/target/site/jacoco/

  # ── Step 2b: build + test inventory-service (only if it changed) ──────────
  build-inventory-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.inventory-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test inventory-service
        run: mvn -B -pl inventory-service -am verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-service-coverage
          path: inventory-service/target/site/jacoco/

  # ── Step 3: build Docker images and push to GHCR (main branch only) ───────
  docker-push:
    needs: [build-order-service, build-inventory-service]
    # always() lets this job run even when a build job was skipped (nothing changed)
    # We still gate on: we are on main, and no job actually failed
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      packages: write   # required to push to ghcr.io
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build both JARs (-DskipTests: tests already passed above)
      - name: Package all modules
        run: mvn -B package -DskipTests

      # Log in to GitHub Container Registry using the auto-provided GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push order-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./order-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/order-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/order-service:latest

      - name: Build and push inventory-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./inventory-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/inventory-service:latest
