services:

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      # Docker Compose resolves "inventory-service" as the hostname of the other container
      - INVENTORY_SERVICE_URL=http://inventory-service:8081
      # Override scheduler interval for demo purposes (10 seconds instead of 5 minutes)
      - SCHEDULER_INTERVAL_MS=10000
    depends_on:
      inventory-service:
        condition: service_healthy
